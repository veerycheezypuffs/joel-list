<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Joel List</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
}

/* header */

.header{
    text-align:center;
    padding:50px 20px 30px 20px;
}

.header h1{
    margin:0;
    font-size:42px;
}

.header p{
    color:#777;
}

/* container */

.container{
    width:900px;
    margin:auto;
}

/* list */

.list{
    background:white;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.entry{
    display:flex;
    padding:18px 20px;
    border-top:1px solid #eee;
    align-items:center;
}

.entry:first-child{
    border-top:none;
}

.entry:hover{
    background:#fafafa;
}

/* rank auto numbering */

.list{
    counter-reset: rank;
}

.entry{
    counter-increment: rank;
}

.rank::before{
    content: "#" counter(rank);
}

.rank{
    width:70px;
    font-weight:bold;
    color:#cbb000;
    font-size:18px;
}

/* level info */

.level{
    flex:1;
}

.levelname{
    font-size:20px;
}

.creator{
    font-size:14px;
    color:#777;
}

/* video link */

.video a{
    color:#3498db;
    text-decoration:none;
    font-weight:bold;
}

.video a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="header">
<h1>Joel List</h1>
<p>Levels beaten by Cubed_Cubed's pet, JOEL!!</p>
</div>

<div class="container">

<div class="list">

</div>

</div>
</div>

</body>
</html>
